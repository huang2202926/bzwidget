<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - 搬砖收入小组件</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1b2629;
      color: #e8eef0;
      padding: 24px;
      font-size: 13px;
      overflow-y: auto;
    }
    h1 { font-size: 18px; margin-bottom: 18px; color: #2dd4bf; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #9aa9ad; font-weight: 500; }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="range"], textarea, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #243034;
      color: #e8eef0;
      font-size: 13px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #2dd4bf; }
    textarea { min-height: 70px; resize: vertical; font-family: 'Consolas', monospace; }
    .hint { font-size: 11px; color: #5a6b6f; margin-top: 4px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    button {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-primary { background: #2dd4bf; color: #102a2a; }
    .btn-primary:hover { background: #5eead4; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #e8eef0; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .section { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
    .section-title { font-size: 14px; color: #c5d0d3; margin-bottom: 14px; font-weight: 600; }
    #opacityValue { display: inline-block; min-width: 36px; color: #2dd4bf; }
    .api-fields { display: none; }
    .api-fields.active { display: block; }
    .local-admin { display: flex; align-items: center; gap: 10px; }
    .local-admin code {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(45,212,191,0.08);
      border: 1px solid rgba(45,212,191,0.2);
      color: #2dd4bf;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .local-admin button { flex: 0 0 auto; }
    .mode-actions { display: flex; gap: 10px; }
    .mode-btn {
      flex: 0 0 96px;
      padding: 8px 0;
      border-radius: 9px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.16);
      color: #9aa9ad;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .mode-btn:hover { background: rgba(255,255,255,0.06); color: #c5d0d3; }
    .mode-btn.active { border-color: #2dd4bf; color: #2dd4bf; background: rgba(45,212,191,0.1); }
  </style>
</head>
<body>
  <h1>搬砖收入小组件设置</h1>

  <div class="section">
    <div class="section-title">内置后台（改参数，立即生效）</div>
    <div class="local-admin">
      <code id="adminUrl">内置后台窗口</code>
      <button class="btn-secondary" id="btnOpenAdmin">打开后台</button>
    </div>
    <div class="hint">后台以程序窗口打开（不调起浏览器），改完保存，小组件会自动刷新，无需重启。</div>
  </div>

  <div class="form-group">
    <label>数据来源</label>
    <select id="dataSource">
      <option value="api">内置后台 / API 接口</option>
      <option value="mock">本地静态模拟数据</option>
    </select>
  </div>

  <div class="form-group api-fields" id="apiFields">
    <label>API 地址</label>
    <input type="text" id="apiUrl" placeholder="http://127.0.0.1:3456/api/today">
    <div class="hint">留空则自动使用内置后台接口；也可填自建接口，返回 JSON 字段：income、progress、status、paydayDay、monthlySalary、workStartTime、workEndTime</div>

    <label style="margin-top: 12px;">请求头 Headers（JSON）</label>
    <textarea id="apiHeaders" placeholder='{"Authorization":"Bearer xxx"}'></textarea>
    <div class="hint">如需 Cookie/Token，按 JSON 格式填写</div>
  </div>

  <div class="form-group">
    <label>刷新间隔（毫秒）</label>
    <input type="number" id="refreshInterval" min="2000" step="1000" value="10000">
    <div class="hint">最少 2000 毫秒，默认 10000 毫秒（10 秒）</div>
  </div>

  <div class="section">
    <div class="section-title">窗口</div>
    <div class="form-group">
      <label><input type="checkbox" id="alwaysOnTop" style="margin-right:6px;"> 窗口始终置顶</label>
    </div>
    <div class="form-group">
      <label>透明度 <span id="opacityValue">0.95</span></label>
      <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="0.95">
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary" id="btnCancel">取消</button>
    <button class="btn-primary" id="btnSave">保存</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
