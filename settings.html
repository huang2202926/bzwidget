<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - 搬砖收入小组件</title>
  <link rel="stylesheet" href="themes.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--skin-bg);
      color: var(--skin-text);
      padding: 24px;
      font-size: 13px;
      overflow-y: auto;
    }
    h1 { font-size: 18px; margin-bottom: 18px; color: var(--skin-accent); }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--skin-muted); font-weight: 500; }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="range"], textarea, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--skin-track);
      background: var(--skin-surface);
      color: var(--skin-text);
      font-size: 13px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--skin-accent); }
    textarea { min-height: 70px; resize: vertical; font-family: 'Consolas', monospace; }
    .hint { font-size: 11px; color: var(--skin-muted); margin-top: 4px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    button {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-primary { background: var(--skin-accent); color: var(--skin-on-accent); }
    .btn-primary:hover { background: var(--skin-accent-end); }
    .btn-secondary { background: var(--skin-track); color: var(--skin-text); }
    .btn-secondary:hover { background: var(--skin-hover); }
    .section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--skin-border); }
    .section-title { font-size: 14px; color: var(--skin-text); margin-bottom: 14px; font-weight: 600; }
    #opacityValue { display: inline-block; min-width: 36px; color: var(--skin-accent); }
    .api-fields { display: none; }
    .api-fields.active { display: block; }
    .local-admin { display: flex; align-items: center; gap: 10px; }
    .local-admin code {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--skin-hover);
      border: 1px solid var(--skin-border);
      color: var(--skin-accent);
      font-family: 'Consolas', monospace;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .local-admin button { flex: 0 0 auto; }
    .mode-actions { display: flex; gap: 10px; }
    .mode-btn {
      flex: 0 0 96px;
      padding: 8px 0;
      border-radius: 9px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.16);
      color: var(--skin-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .mode-btn:hover { background: rgba(255,255,255,0.06); color: var(--skin-text); }
    .mode-btn.active { border-color: var(--skin-accent); color: var(--skin-accent); background: rgba(45,212,191,0.1); }
    .theme-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .theme-choice { position: relative; text-align: left; background: var(--skin-bg); color: var(--skin-text); border: 2px solid var(--skin-border); padding: 12px; }
    .theme-choice[aria-pressed="true"] { border-color: var(--skin-accent); }
    .theme-choice[aria-pressed="true"]::after { content: '✓'; position: absolute; right: 10px; top: 10px; color: var(--skin-accent); }
    .theme-choice:focus-visible { outline: 2px solid var(--skin-accent); outline-offset: 3px; }
    .theme-choice:disabled { cursor: wait; }
    .theme-sample { display: block; margin-top: 8px; color: var(--skin-accent); font-size: 22px; font-variant-numeric: tabular-nums; }
    .theme-line { display: block; margin-top: 8px; height: 4px; border-radius: 3px; background: var(--skin-track); }
    .theme-line::before { content: ''; display: block; width: 65%; height: 100%; border-radius: inherit; background: var(--skin-accent); }
    #themeMessage { min-height: 28px; }
  </style>
</head>
<body>
  <h1>搬砖收入小组件设置</h1>
  <div class="form-group">
    <div class="section-title" id="themeLabel">小组件皮肤</div>
    <div class="theme-picker" id="themePicker" role="group" aria-labelledby="themeLabel"></div>
    <div class="hint" id="themeMessage" role="status" aria-live="polite">点击皮肤立即应用并自动保存，其他设置请点击底部“保存”。</div>
  </div>

  <div class="section">
    <div class="section-title">内置后台（改参数，立即生效）</div>
    <div class="local-admin">
      <code id="adminUrl">内置后台窗口</code>
      <button class="btn-secondary" id="btnOpenAdmin">打开后台</button>
    </div>
    <div class="hint">后台以程序窗口打开（不调起浏览器），改完保存，小组件会自动刷新，无需重启。</div>
  </div>

  <div class="form-group">
    <label>数据来源</label>
    <select id="dataSource">
      <option value="api">内置后台 / API 接口</option>
      <option value="mock">本地静态模拟数据</option>
    </select>
  </div>

  <div class="form-group api-fields" id="apiFields">
    <label>API 地址</label>
    <input type="text" id="apiUrl" placeholder="http://127.0.0.1:3456/api/today">
    <div class="hint">留空则自动使用内置后台接口；也可填自建接口，返回 JSON 字段：income、progress、status、paydayDay、monthlySalary、workStartTime、workEndTime</div>

    <label style="margin-top: 12px;">请求头 Headers（JSON）</label>
    <textarea id="apiHeaders" placeholder='{"Authorization":"Bearer xxx"}'></textarea>
    <div class="hint">如需 Cookie/Token，按 JSON 格式填写</div>
  </div>

  <div class="form-group">
    <label>刷新间隔（毫秒）</label>
    <input type="number" id="refreshInterval" min="2000" step="1000" value="10000">
    <div class="hint">最少 2000 毫秒，默认 10000 毫秒（10 秒）</div>
  </div>

  <div class="section">
    <div class="section-title">窗口</div>
    <div class="form-group">
      <label><input type="checkbox" id="alwaysOnTop" style="margin-right:6px;"> 窗口始终置顶</label>
    </div>
    <div class="form-group">
      <label>透明度 <span id="opacityValue">0.95</span></label>
      <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="0.95">
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary" id="btnCancel">取消</button>
    <button class="btn-primary" id="btnSave">保存</button>
  </div>

  <script src="themes.js"></script>
  <script src="settings.js"></script>
</body>
</html>
