<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>preview</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 55%, #134e4a 100%); }
  .widget { padding: 22px; }
  .card { width: 280px; height: 192px; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
</style>
</head>
<body class="widget">
  <div class="card">
    <div class="header"><span class="title">今日学习进度</span></div>
    <div class="amount">
      <span class="currency"></span>
      <span class="value">32.02</span>
      <span class="unit-suffix">分</span>
    </div>
    <div class="countdown">距月考还有 8 天 6 小时 23 分</div>
    <div class="progress-row">
      <span class="status-dot"></span>
      <span class="status-text">学习中</span>
      <span class="percent">32%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:32%"></div></div>
    <div class="last-update">刚刚更新</div>
  </div>
</body>
</html>
